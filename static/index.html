<body>
  <div class="home">
    <!-- Node: wallpaperBlur (ID: 84:32) -->

    <!-- Node: web (ID: 84:18) -->

      <!-- Node: wallpaper (ID: 84:29) -->
      <div class="wallpaper"></div>

      <div class="main">
        <nav class="navbar home-hero-nav">
          <div class="nav-content">
            <a href="/" class="nav-item">
              <i data-lucide="house"></i>
              <span>Home</span>
            </a>
            <a href="/a" class="nav-item">
              <i data-lucide="gamepad-2"></i>
              <span>Games</span>
            </a>
            <a href="/b" class="nav-item">
              <i data-lucide="grid-2x2"></i>
              <span>Apps</span>
            </a>

              <span>Tabs</span>
            </a>

              <i data-lucide="settings-2"></i>
              <span>Settings</span>
            </a>
          </div>
        </nav>
        <h1 class="title">INFRARED</h1>
        <p class="subtitle" id="dynamic-subtitle">Using Interstellar to push boundary's of luxury at school</p>

      <div class="blur-group">
        <div class="ellipse e1"></div>

  <script src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script>
    window.lucide?.createIcons({
      attrs: {
        width: 14,
        height: 14,
        strokeWidth: 2,
      },
    });
  </script>
  <script src="/vendor/motion/motion.js"></script>
  <script src="/assets/js/home-motion.js"></script>
  <script>
    // Restore tip logic
    let tips = [];
    let currentTipIndex = 0;
    let subtitleElement;

    async function loadTips() {
      try {
        const response = await fetch('/tips.json');
        tips = await response.json();
        subtitleElement = document.getElementById('dynamic-subtitle');

        if (tips.length > 0) {
          currentTipIndex = Math.floor(Math.random() * tips.length);
          subtitleElement.textContent = tips[currentTipIndex].content;
          window.animateHomeTipReveal?.(true);
          setTimeout(startTipCycle, 6500);
        }
      } catch (error) {
        console.error('Failed to load tips:', error);
      }
    }

    function startTipCycle() {
      const showNextTip = () => {
        let newTipIndex;
        do {
          newTipIndex = Math.floor(Math.random() * tips.length);
        } while (tips.length > 1 && newTipIndex === currentTipIndex);

        currentTipIndex = newTipIndex;
        subtitleElement.textContent = tips[currentTipIndex].content;
        window.animateHomeTipReveal?.();
        setTimeout(startTipCycle, 6500);
      };

      if (window.animateHomeTipExit) {
        window.animateHomeTipExit(showNextTip);
      } else {
        subtitleElement.style.opacity = '0';
        setTimeout(showNextTip, 500);
      }
    }

    loadTips();
  </script>
</body>

</html>
