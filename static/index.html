<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Home</title>
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/h.css?v=01" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="/assets/css/home_v3.css?v=04" />
</head>

<body>
  <div class="home">
    <!-- Node: wallpaperBlur (ID: 84:32) -->
    <div class="wallpaper-blur"></div>

    <!-- Node: sidebar (ID: 89:49) -->
    <div class="sidebar">
    </div>

    <!-- Node: web (ID: 84:18) -->
    <div class="web">
      <!-- Node: wallpaper (ID: 84:29) -->
      <div class="wallpaper"></div>
      
      <nav class="navbar">
        <div class="nav-content">
          <a href="/" class="nav-item">Home</a>
          <a href="/a" class="nav-item">Games</a>
          <a href="/b" class="nav-item">Apps</a>
          <a href="/d" class="nav-item">Tabs</a>
          <a href="/c" class="nav-item">Settings</a>
        </div>
      </nav>
      
      <div class="main">
        <h1 class="title">INFRARED</h1>
        <p class="subtitle" id="dynamic-subtitle">Using Interstellar to push boundary's of luxury at school</p>
      </div>
      
      <div class="blur-group">
        <div class="ellipse e1"></div>
        <div class="ellipse e2"></div>
        <div class="ellipse e3"></div>
        <div class="ellipse e4"></div>
        <div class="ellipse e5"></div>
      </div>
    </div>
  </div>

  <script>
    // Restore tip logic
    const navbar = document.querySelector('.navbar');
    let hideTimeout;

    function showNavbar() {
      navbar.classList.add('visible');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        navbar.classList.remove('visible');
      }, 2000);
    }

    function handleMouseMove(event) {
      if (event.clientY <= 60) {
        showNavbar();
      }
    }

    document.addEventListener('mousemove', handleMouseMove);

    let tips = [];
    let currentTipIndex = 0;
    let subtitleElement;

    async function loadTips() {
      try {
        const response = await fetch('/tips.json');
        tips = await response.json();
        subtitleElement = document.getElementById('dynamic-subtitle');

        if (tips.length > 0) {
          currentTipIndex = Math.floor(Math.random() * tips.length);
          subtitleElement.textContent = tips[currentTipIndex].content;
          subtitleElement.style.opacity = '1';
          setTimeout(startTipCycle, 6500);
        }
      } catch (error) {
        console.error('Failed to load tips:', error);
      }
    }

    function startTipCycle() {
      subtitleElement.style.opacity = '0';
      setTimeout(() => {
        let newTipIndex;
        do {
          newTipIndex = Math.floor(Math.random() * tips.length);
        } while (tips.length > 1 && newTipIndex === currentTipIndex);

        currentTipIndex = newTipIndex;
        subtitleElement.textContent = tips[currentTipIndex].content;
        subtitleElement.style.opacity = '1';
        setTimeout(startTipCycle, 6500);
      }, 500);
    }

    loadTips();
  </script>
</body>

</html>
