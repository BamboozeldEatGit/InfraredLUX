</head>

<body>
    <div class="hidden-nav-overlay" id="hidden-nav-overlay">
        <div class="hidden-nav-links">
            <a href="/d" title="Tabs">Tabs</a>
            <a href="/c" title="Settings">Settings</a>
        </div>
    </div>
    <div class="home">
        <div class="wallpaper-blur"></div>
        <div class="web">
            <div class="wallpaper"></div>
            <div class="main">
                <nav class="navbar home-hero-nav">
                    <div class="nav-content">
                        <a href="/" class="nav-item">
                            <i data-lucide="house"></i>
                            <span>Home</span>
                        </a>
                        <a href="/a" class="nav-item">
                            <i data-lucide="gamepad-2"></i>
                            <span>Games</span>
                        </a>
                        <a href="/b" class="nav-item">
                            <i data-lucide="grid-2x2"></i>
                            <span>Apps</span>
                        </a>
                        <a href="/d" class="nav-item">
                            <i data-lucide="panels-top-left"></i>
                            <span>Tabs</span>
                        </a>
                        <a href="/c" class="nav-item">
                            <i data-lucide="settings-2"></i>
                            <span>Settings</span>
                        </a>
                    </div>
                </nav>
                <h1 class="title">INFRARED</h1>
                <p class="subtitle" id="dynamic-subtitle">Using Interstellar to push boundary's of luxury at school</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js"></script>
    <script>
        window.lucide?.createIcons({
            attrs: {
                width: 14,
                height: 14,
                strokeWidth: 2,
            },
        });
    </script>
    <script src="/vendor/motion/motion.js"></script>
    <script src="/assets/js/home-motion.js"></script>

    <script>
        // Tips rotation system
        let tips = [];
        let currentTipIndex = 0;
        let tipRotationInterval;

        async function loadTips() {
            try {
                const response = await fetch('/tips.json');
                tips = await response.json();
                if (tips.length > 0) {
                    displayRandomTip();
                    startTipRotation();
                }
            } catch (error) {
                console.error('Error loading tips:', error);
            }
        }

        function displayTip(index) {
            if (!tips.length) return;

            const subtitle = document.getElementById('dynamic-subtitle');
            if (!subtitle) return;

            currentTipIndex = index % tips.length;
            const tip = tips[currentTipIndex];

            window.animateHomeTipExit(() => {
                subtitle.textContent = tip.content;
                window.animateHomeTipReveal(false);
            });
        }

        function displayRandomTip() {
            if (!tips.length) return;
            const randomIndex = Math.floor(Math.random() * tips.length);
            displayTip(randomIndex);
        }

        function nextTip() {
            displayRandomTip();
        }

        function startTipRotation() {
            const subtitle = document.getElementById('dynamic-subtitle');
            if (subtitle) {
                subtitle.addEventListener('click', nextTip);

                // Auto-rotate tips every 6 seconds
                tipRotationInterval = setInterval(nextTip, 6000);
            }
        }

        document.addEventListener('DOMContentLoaded', loadTips);

        // Personalization Settings
        function loadPersonalizationSettings() {
            const PERSONALIZATION_KEY = "infraredPersonalization";
            const stored = localStorage.getItem(PERSONALIZATION_KEY);
            const settings = stored ? JSON.parse(stored) : {
                backgroundImage: null,
                backgroundColor: "#1a1a1a",
                useDefaultBackground: true,
                showLogo: true,
                showNavbar: true,
                showTips: true
            };

            // Apply background
            const wallpaper = document.querySelector('.wallpaper');
            const wallpaperBlur = document.querySelector('.wallpaper-blur');
            const navbar = document.querySelector('.navbar');

            if (settings.useDefaultBackground) {
                // Use default background
                if (wallpaper) {
                    wallpaper.style.backgroundImage = "url('/assets/media/homebg.png')";
                    wallpaper.style.backgroundColor = '';
                }
                if (wallpaperBlur) {
                    wallpaperBlur.style.backgroundImage = "url('/assets/media/homebg.png')";
                    wallpaperBlur.style.backgroundColor = '';
                }
                if (navbar) {
                    navbar.style.backgroundImage = '';
                    navbar.style.backgroundColor = '';
                }
            } else if (settings.backgroundImage) {
                // Use custom image
                if (wallpaper) {
                    wallpaper.style.backgroundImage = `url('${settings.backgroundImage}')`;
                    wallpaper.style.backgroundSize = 'cover';
                    wallpaper.style.backgroundPosition = 'center';
                }
                if (wallpaperBlur) {
                    wallpaperBlur.style.backgroundImage = `url('${settings.backgroundImage}')`;
                    wallpaperBlur.style.backgroundSize = 'cover';
                    wallpaperBlur.style.backgroundPosition = 'center';
                }
                if (navbar) {
                    navbar.style.backgroundImage = `url('${settings.backgroundImage}')`;
                    navbar.style.backgroundSize = 'cover';
                    navbar.style.backgroundPosition = 'center';
                }
            } else if (settings.backgroundColor) {
                // Use custom color
                if (wallpaper) {
                    wallpaper.style.backgroundImage = '';
                    wallpaper.style.backgroundColor = settings.backgroundColor;
                }
                if (wallpaperBlur) {
                    wallpaperBlur.style.backgroundImage = '';
                    wallpaperBlur.style.backgroundColor = settings.backgroundColor;
                }
                if (navbar) {
                    navbar.style.backgroundImage = '';
                    navbar.style.backgroundColor = settings.backgroundColor;
                }
            }

            // Toggle logo visibility
            const logo = document.querySelector('.title');
            if (logo) {
                logo.style.display = settings.showLogo ? 'block' : 'none';
            }

            // Toggle navbar visibility
            const hiddenNavOverlay = document.getElementById('hidden-nav-overlay');
            if (navbar) {
                navbar.style.display = settings.showNavbar ? 'flex' : 'none';
                if (hiddenNavOverlay) {
                    if (!settings.showNavbar) {
                        hiddenNavOverlay.classList.add('navbar-hidden');
                    } else {
                        hiddenNavOverlay.classList.remove('navbar-hidden');
                    }
                }
            }

            // Toggle tips visibility
            const subtitle = document.getElementById('dynamic-subtitle');
            if (subtitle) {
                subtitle.style.display = settings.showTips ? 'block' : 'none';
            }
        }

        // Listen for storage changes from settings panel
        window.addEventListener('storage', (e) => {
            if (e.key === 'infraredPersonalization') {
                loadPersonalizationSettings();
            }
        });

        document.addEventListener('DOMContentLoaded', loadPersonalizationSettings);
    </script>

    <!-- Global Command Box for all pages -->
    <div id="global-command-box-overlay" class="command-box-overlay">
        <div class="command-box-wrapper">
            <div class="command-box">
                <div class="command-box-search">
                    <svg class="command-box-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span id="global-command-prefix" class="command-prefix" aria-hidden="true"></span>
                    <input type="text" id="global-command-box-input" class="command-box-input"
                        placeholder="Search or enter URL..." autocomplete="off" />
                </div>
                <div id="global-command-box-suggestions" class="command-box-suggestions">
                    <!-- Suggestions will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cookie management helpers (top-level so they're available everywhere)
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(nameEQ)) {
                    return decodeURIComponent(cookie.substring(nameEQ.length));
                }
            }
            return null;
        }

        function setCookie(name, value, days = 30) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/";
        }

        function trackSearch(url) {
            const history = JSON.parse(getCookie("searchHistory") || "{}");
            history[url] = (history[url] || 0) + 1;
            setCookie("searchHistory", JSON.stringify(history));
        }

        const defaultSuggestions = [
            { title: "YouTube", url: "youtube.com", icon: "🎥" },
            { title: "Home / X", url: "x.com/home", icon: "𝕏" },
            { title: "Google", url: "google.com", icon: "G" },
            { title: "GitHub", url: "github.com", icon: "⚙" },
            { title: "Stack Overflow", url: "stackoverflow.com", icon: "SO" }
        ];

        function getSortedSuggestions() {
            const history = JSON.parse(getCookie("searchHistory") || "{}");
            const suggestions = [...defaultSuggestions];
            suggestions.forEach(s => { s.frequency = history[s.url] || 0; });
            return suggestions.sort((a, b) => b.frequency - a.frequency);
        }

        // track whether the last render was a full menu (/a or /b)
        window._globalCommandLastWasMenu = window._globalCommandLastWasMenu || false;

        function filterGlobalSuggestions(query) {
            const suggestionsContainer = document.getElementById("global-command-box-suggestions");
            if (!suggestionsContainer) return;

            const lowerQuery = (query || "").toLowerCase().trim();
            const isGamesExact = lowerQuery === "/a" || lowerQuery === "/games";
            const isAppsExact = lowerQuery === "/b" || lowerQuery === "/apps";
            const isGamesPrefix = lowerQuery.startsWith("/a") || lowerQuery.startsWith("/games");
            const isAppsPrefix = lowerQuery.startsWith("/b") || lowerQuery.startsWith("/apps");
            const prefixSpan = document.getElementById("global-command-prefix");

            function renderNormal() {
                const all = getSortedSuggestions();
                const filtered = all.filter(s => {
                    if (!lowerQuery) return true;
                    return s.title.toLowerCase().includes(lowerQuery) || s.url.toLowerCase().includes(lowerQuery);
                });

                suggestionsContainer.innerHTML = "";
                filtered.forEach(suggestion => {
                    const div = document.createElement("div");
                    div.className = "command-box-suggestion entering";
                    div.innerHTML = `
            <i data-lucide="globe" class="suggestion-icon"></i>
            <div class="suggestion-content">
              <div class="suggestion-title">${suggestion.title}</div>
              <div class="suggestion-url">${suggestion.url}</div>
            </div>
          `;
                    div.addEventListener("click", () => {
                        trackSearch(suggestion.url);
                        const url = `https://${suggestion.url}`;
                        sessionStorage.setItem("urlToOpen", url);
                        window.location.href = "/d";
                    });
                    suggestionsContainer.appendChild(div);
                });
                window.lucide?.createIcons();
                requestAnimationFrame(() => {
                    suggestionsContainer.querySelectorAll('.command-box-suggestion.entering').forEach(el => {
                        el.classList.remove('entering');
                        el.classList.add('entered');
                    });
                });
                // Reset menu flag when rendering normal suggestions
                window._globalCommandLastWasMenu = false;
            }

            // Handle menu rendering (games/apps)
            if (isGamesPrefix || isAppsPrefix) {
                const menuUrl = isGamesPrefix ? "/assets/json/g.json" : "/assets/json/a.json";
                fetch(menuUrl)
                    .then(res => res.json())
                    .then(items => {
                        const filterText = lowerQuery.replace(/^\/[ab]/, "").trim();
                        const filtered = items.filter(item =>
                            !filterText || item.name.toLowerCase().includes(filterText) || (item.link && item.link.toLowerCase().includes(filterText))
                        );

                        suggestionsContainer.innerHTML = "";
                        filtered.forEach(item => {
                            const div = document.createElement("div");
                            div.className = "command-box-suggestion entering";
                            div.innerHTML = `
            <i data-lucide="gamepad-2" class="suggestion-icon"></i>
            <div class="suggestion-content">
              <div class="suggestion-title">${item.name}</div>
              <div class="suggestion-url">${item.link || ""}</div>
            </div>
          `;
                            div.addEventListener("click", () => {
                                sessionStorage.setItem("urlToOpen", item.link);
                                window.location.href = "/d";
                            });
                            suggestionsContainer.appendChild(div);
                        });
                        window.lucide?.createIcons();
                        requestAnimationFrame(() => {
                            suggestionsContainer.querySelectorAll('.command-box-suggestion.entering').forEach(el => {
                                el.classList.remove('entering');
                                el.classList.add('entered');
                            });
                        });

                        // Expand animation if currently collapsed
                        const commandBox = document.querySelector('.command-box');
                        if (commandBox && commandBox.classList.contains('collapsed')) {
                            commandBox.classList.remove('collapsed');
                            const motion = window.Motion;
                            if (motion?.animate) {
                                motion.animate(
                                    commandBox,
                                    { maxHeight: ["50px", "80vh"] },
                                    { duration: 0.3, ease: [0.22, 1, 0.36, 1] }
                                );
                                motion.animate(
                                    suggestionsContainer,
                                    { opacity: [0, 1] },
                                    { duration: 0.25, ease: [0.22, 1, 0.36, 1] }
                                );
                            }
                            commandBox.classList.add('expanded');
                        }

                        window._globalCommandLastWasMenu = true;
                    })
                    .catch(err => console.error("Error loading menu:", err));
                return;
            }

            prefixSpan.classList.remove("visible");
            if (window._globalCommandLastWasMenu) {
                const children = Array.from(suggestionsContainer.children);
                // If the user cleared the input entirely, collapse the command box instead of showing default suggestions
                if (!lowerQuery) {
                    const commandBox = document.querySelector('.command-box');
                    if (commandBox) {
                        commandBox.classList.remove('expanded');
                        // Animate collapse with Motion library
                        const motion = window.Motion;
                        if (motion?.animate) {
                            motion.animate(
                                commandBox,
                                { maxHeight: ["80vh", "50px"] },
                                { duration: 0.3, ease: [0.22, 1, 0.36, 1] }
                            );
                            // Fade out suggestions
                            motion.animate(
                                suggestionsContainer,
                                { opacity: [1, 0] },
                                { duration: 0.25, ease: [0.22, 1, 0.36, 1] }
                            );
                        }
                        setTimeout(() => {
                            commandBox.classList.add('collapsed');
                        }, 25);
                    }
                    suggestionsContainer.innerHTML = "";
                    window._globalCommandLastWasMenu = false;
                    return;
                }
                if (children.length) {
                    children.forEach(c => { c.classList.remove("entering"); c.classList.add("exiting"); });
                    setTimeout(() => {
                        suggestionsContainer.innerHTML = "";
                        window._globalCommandLastWasMenu = false;
                        renderNormal();
                    }, 220);
                    return;
                }
                window._globalCommandLastWasMenu = false;
            }

            // Only render normal suggestions if not collapsed
            const commandBox = document.querySelector('.command-box');
            if (!commandBox || !commandBox.classList.contains('collapsed')) {
                renderNormal();
            }

            const globalInput = document.getElementById("global-command-box-input");
            if (globalInput) {
                let selectedIndex = -1;
                if (!globalInput.dataset._listenersAttached) {
                    globalInput.addEventListener("input", (e) => {
                        selectedIndex = -1;
                        filterGlobalSuggestions(e.target.value);
                    });

                    globalInput.addEventListener("keydown", (e) => {
                        const suggestions = document.querySelectorAll("#global-command-box-suggestions .command-box-suggestion");

                        if (e.key === "ArrowDown") {
                            e.preventDefault();
                            e.stopPropagation();
                            selectedIndex = Math.min(selectedIndex + 1, suggestions.length - 1);
                            updateSelection();
                        } else if (e.key === "ArrowUp") {
                            e.preventDefault();
                            e.stopPropagation();
                            selectedIndex = Math.max(selectedIndex - 1, -1);
                            updateSelection();
                        } else if (e.key === "Enter") {
                            if (selectedIndex >= 0) {
                                e.preventDefault();
                                suggestions[selectedIndex].click();
                            } else {
                                const value = globalInput.value.trim();
                                if (value) {
                                    const isUrl = /^http(s?):\/\//.test(value) || (value.includes(".") && !value.includes(" "));
                                    const url = isUrl ? (value.startsWith("http") ? value : `https://${value}`) : `https://duckduckgo.com/?q=${encodeURIComponent(value)}`;
                                    if (isUrl) {
                                        const domain = value.includes(".") ? value.replace(/https?:\/\//i, "").split("/")[0] : value;
                                        trackSearch(domain);
                                    }
                                    sessionStorage.setItem("urlToOpen", url);
                                    window.location.href = "/d";
                                }
                            }
                        }

                        function updateSelection() {
                            suggestions.forEach((item, idx) => {
                                if (idx === selectedIndex) {
                                    item.classList.add("active");
                                } else {
                                    item.classList.remove("active");
                                }
                            });
                            // ensure selected item is visible inside suggestions container; run after DOM updates
                            requestAnimationFrame(() => {
                                if (selectedIndex >= 0 && suggestions[selectedIndex]) {
                                    try { suggestions[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'auto' }); } catch (e) { /* ignore */ }
                                }
                            });
                        }

                    });
                    globalInput.dataset._listenersAttached = "1";
                }
            }

            document.getElementById("global-command-box-overlay")?.addEventListener("click", (e) => {
                if (e.target.id === "global-command-box-overlay") {
                    e.target.classList.remove("active");
                }
            });
        }

        // Global keydown to open command box (Ctrl+K)
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                e.preventDefault();
                const overlay = document.getElementById("global-command-box-overlay");
                const input = document.getElementById("global-command-box-input");
                if (overlay && input) {
                    overlay.classList.add("active");
                    input.focus();
                    input.value = "";
                    filterGlobalSuggestions(""); // Show all suggestions
                }
            }
        }, true);

        // Close with Escape on global overlay (non-tabs pages)
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                document.getElementById("global-command-box-overlay")?.classList.remove("active");
            }
        });
    </script>
