<!doctype html>
<html lang="en" data-infrared-shell="true">

<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.png" />
    <title>INFRARED</title>
    <link rel="stylesheet" href="/assets/css/page-shell.css" />
    <script>
        if (localStorage.getItem("infraredPageShelling") !== "true") {
            window.location.href = "/home";
        }
    </script>
</head>

<body>
    <main class="page-shell" aria-label="Infrared page shell">
        <iframe class="page-frame is-active" data-shell-page="home" title="Home" src="/home" loading="eager"></iframe>
        <iframe class="page-frame" data-shell-page="games" title="Games" src="/a" loading="eager"></iframe>
        <iframe class="page-frame" data-shell-page="apps" title="Apps" src="/b" loading="eager"></iframe>
        <iframe class="page-frame" data-shell-page="tabs" title="Tabs" src="/d" loading="eager"></iframe>
        <iframe class="page-frame" data-shell-page="settings" title="Settings" src="/c" loading="eager"></iframe>
    </main>

    <script src="/assets/js/page-shell.js"></script>
</body>

</html>
