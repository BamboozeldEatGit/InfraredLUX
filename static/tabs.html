  <script>
    // Auto-hide navigation bar
    const navbar = document.querySelector('.nav-bar');
    const navWrapper = document.getElementById('nav-wrapper');
    let hideTimeout;

    function showNavbar() {
      navbar.classList.add('visible');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        navbar.classList.remove('visible');
      }, 2000); // Hide after 2 seconds of no mouse movement
    }

    function hideNavbar() {
      clearTimeout(hideTimeout);
      navbar.classList.remove('visible');
    }

    function handleMouseMove(event) {
      // Show navbar if mouse is within 60px of top of screen
      if (event.clientY <= 60) {
        showNavbar();
      }
    }

    function handleClick(event) {
      // If clicking on navbar, keep it visible and reset timer
      if (navbar.contains(event.target)) {
        showNavbar();
      } else if (navbar.classList.contains('visible')) {
        // If clicking outside navbar and it's visible, hide it
        hideNavbar();
      }
    }

    // Auto-hide nav-wrapper when mouse leaves
    navWrapper.addEventListener('mouseleave', () => {
      if (navbar.classList.contains('visible')) {
        hideNavbar();
      }
    });

    // Show navbar on mouse movement near top
    document.addEventListener('mousemove', handleMouseMove);

    // Handle clicks to show/hide navbar
    document.addEventListener('click', handleClick);

    // Show navbar on scroll to top
    window.addEventListener('scroll', () => {
      if (window.scrollY === 0) {
        showNavbar();
      }
    });

    // Show navbar initially for a brief moment
    setTimeout(() => {
      showNavbar();
    }, 500);
  </script>
