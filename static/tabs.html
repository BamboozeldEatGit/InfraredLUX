<body id="no">
  <div class="wallpaper-blur"></div>
  <aside class="sidebar" id="tabs-sidebar">

        <div class="browser-url-row">
          <form id="fv" class="navpost browser-url-form" method="POST">
            <input id="iv" class="bar side-bar browser-url-input" placeholder="http://localhost:8080/d" type="text" />
          </form>
          <div class="browser-url-actions">
            <button title="Fullscreen" id="fullscreen-button" class="nav-button browser-icon-btn" onclick="FS()">

      <div id="tabs-list-wrapper">
        <button title="add-tab" id="add-tab" type="button" aria-label="Create new tab">

  </aside>
  <div class="tabs-web">
    <div class="frame-container" id="frame-container"></div>
  </div>
  <script src="/vendor/motion/motion.js"></script>
  <script src="assets/js/007.js?v=000"></script>
  <script src="assets/js/page-shell.js"></script>
  <script src="./assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="./assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/js/001.js?v=001"></script>

  <script>
    const tabsSidebar = document.getElementById('tabs-sidebar');
    document.body.classList.add('sidebar-collapsed');
    if (tabsSidebar) {
      let collapseTimer;
      const openSidebar = () => {
        clearTimeout(collapseTimer);
        document.body.classList.remove('sidebar-collapsed');
      };
      const collapseSidebar = () => {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          document.body.classList.add('sidebar-collapsed');
        }, 140);
      };

      tabsSidebar.addEventListener('mouseenter', () => {
        openSidebar();
      });
      tabsSidebar.addEventListener('mouseleave', () => {
        // Don't collapse sidebar if command box is open
        const commandBoxOverlay = document.getElementById('command-box-overlay');
        if (commandBoxOverlay && commandBoxOverlay.classList.contains('active')) {
          return;
        }
        collapseSidebar();
      });
      document.addEventListener('mousemove', (event) => {
        // Don't collapse sidebar if command box is open
        const commandBoxOverlay = document.getElementById('command-box-overlay');
        if (commandBoxOverlay && commandBoxOverlay.classList.contains('active')) {
          return;
        }
        if (event.clientX <= 8) {
          openSidebar();
        } else if (event.clientX > 310 && !tabsSidebar.matches(':hover')) {
          collapseSidebar();
        }
      });
    }

    // Global Ctrl+K handler that works even when iframe is focused
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        const overlay = document.getElementById("command-box-overlay");
        const input = document.getElementById("command-box-input");
        if (overlay && input) {
          overlay.classList.add("active");
          input.focus();
          input.value = "";
        }
      }
    }, true); // Use capture phase to intercept before iframe gets it
  </script>

  <!-- Animated Command Box -->
  <div id="command-box-overlay" class="command-box-overlay">
    <div class="command-box-wrapper">
      <div class="command-box">
        <div class="command-box-search">
          <svg class="command-box-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="command-box-input" class="command-box-input" placeholder="Search..."
            autocomplete="off" />
        </div>
        <div id="command-box-suggestions" class="command-box-suggestions">
          <!-- Suggestions will be populated here -->
        </div>
      </div>
    </div>

  <!-- Layout Popup Island -->

        <rect class="pane pane-right" x="40" y="2" width="30" height="44" rx="3" fill="transparent" />
      </svg>
    </div>
    <div class="layout-option" data-layout="top-bottom" title="Split Top-Bottom">
      <svg viewBox="0 0 72 48" fill="none" stroke="currentColor" stroke-width="1">
        <rect class="pane pane-top" x="2" y="2" width="68" height="20" rx="3" fill="transparent" />
        <rect class="pane pane-bottom" x="2" y="26" width="68" height="20" rx="3" fill="transparent" />
      </svg>
    </div>
  </div>

  <!-- Personalization Settings Loader -->
  <script>
    function loadPersonalizationSettings() {
      const PERSONALIZATION_KEY = "infraredPersonalization";
      const stored = localStorage.getItem(PERSONALIZATION_KEY);
      const settings = stored ? JSON.parse(stored) : {
        backgroundImage: null,
        backgroundColor: "#1a1a1a",
        useDefaultBackground: true,
        showLogo: true,
        showNavbar: true,
        showTips: true
      };

      // Apply background
      const wallpaperBlur = document.querySelector('.wallpaper-blur');

      if (settings.useDefaultBackground) {
        // Use default background
        if (wallpaperBlur) {
          wallpaperBlur.style.backgroundImage = "url('/assets/media/homebg.png')";
          wallpaperBlur.style.backgroundColor = '';
        }
      } else if (settings.backgroundImage) {
        // Use custom image
        if (wallpaperBlur) {
          wallpaperBlur.style.backgroundImage = `url('${settings.backgroundImage}')`;
          wallpaperBlur.style.backgroundSize = 'cover';
          wallpaperBlur.style.backgroundPosition = 'center';
        }
      } else if (settings.backgroundColor) {
        // Use custom color
        if (wallpaperBlur) {
          wallpaperBlur.style.backgroundImage = '';
          wallpaperBlur.style.backgroundColor = settings.backgroundColor;
        }
      }
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', loadPersonalizationSettings);

    // Listen for storage changes from settings panel
    window.addEventListener('storage', (e) => {
      if (e.key === 'infraredPersonalization') {
        loadPersonalizationSettings();
      }
    });
  </script>

  <!-- End of body -->

</html>
