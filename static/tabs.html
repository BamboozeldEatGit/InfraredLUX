<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <link rel="stylesheet" href="assets/css/t.css" />

  <script src="assets/js/003.js"></script>
  <script>
    window.addEventListener("resize", navigator.keyboard.lock(["Escape"]));
  </script>
</head>

<body id="no">
  <div class="wallpaper-blur"></div>
  <aside class="sidebar" id="tabs-sidebar">
    <nav class="nav" id="right-side-nav">
      <div class="sidebar-controls browser-shell">
        <div class="browser-top-row">
          <button title="Back Arrow" class="nav-button browser-icon-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button title="Forward Arrow" class="nav-button browser-icon-btn" onclick="goForward()">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
          <button title="Reload" onclick="reload()" class="nav-button browser-icon-btn">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <div class="browser-grow"></div>
          <button title="Back to Infrared" onclick="window.location.href='index.html'" class="nav-button browser-badge-btn">
            <img src="assets/media/favicon/favicon.png" alt="Infrared" class="logo-img">
          </button>
        </div>
        <div class="browser-url-row">
          <form id="fv" class="navpost browser-url-form" method="POST">
            <input id="iv" class="bar side-bar browser-url-input" placeholder="http://localhost:8080/d" type="text" />
          </form>
          <div class="browser-url-actions">
            <button title="Fullscreen" id="fullscreen-button" class="nav-button browser-icon-btn" onclick="FS()">
              <i class="fa-solid fa-expand"></i>
            </button>
            <button title="Inspect" class="nav-button browser-icon-btn" onclick="eToggle()">
              <i class="fa-solid fa-code"></i>
            </button>
            <button title="Tabs" id="tabs-button" class="nav-button browser-icon-btn">
              <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
          </div>
        </div>
      </div>
      <div id="tabs-list-wrapper">
        <button title="add-tab" id="add-tab" type="button" aria-label="Create new tab">
          <span class="add-tab-icon" aria-hidden="true">+</span>
          <span class="add-tab-label">New Tab</span>
        </button>
        <ul id="tab-list"></ul>
      </div>
    </nav>
  </aside>
  <div class="tabs-web">
    <div class="frame-container" id="frame-container"></div>
  </div>
  <script src="/vendor/motion/motion.js"></script>
  <script src="assets/js/007.js?v=000"></script>
  <script src="./assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="./assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/js/001.js?v=001"></script>

  <script>
    const tabsSidebar = document.getElementById('tabs-sidebar');
    document.body.classList.add('sidebar-collapsed');
    if (tabsSidebar) {
      let collapseTimer;
      const openSidebar = () => {
        clearTimeout(collapseTimer);
        document.body.classList.remove('sidebar-collapsed');
      };
      const collapseSidebar = () => {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          document.body.classList.add('sidebar-collapsed');
        }, 140);
      };

      tabsSidebar.addEventListener('mouseenter', () => {
        openSidebar();
      });
      tabsSidebar.addEventListener('mouseleave', () => {
        collapseSidebar();
      });
      document.addEventListener('mousemove', (event) => {
        if (event.clientX <= 8) {
          openSidebar();
        } else if (event.clientX > 310 && !tabsSidebar.matches(':hover')) {
          collapseSidebar();
        }
      });
    }
  </script>
  <!-- End of body -->
</body>

</html>
