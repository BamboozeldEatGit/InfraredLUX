<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrared</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background: #0a0a0b;
            color: #fafafa;
            font-family: "Outfit", sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 48px;
            animation: slideUp 0.5s ease-out 0.1s both;
        }

        .logo h1 {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fafafa;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 14px;
            color: #52525b;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .option-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 24px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            color: #fafafa;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #1f1f23;
            border-color: #3f3f46;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: #27272a;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #a1a1aa;
        }

        .option-btn:hover .key {
            background: #3f3f46;
            color: #fafafa;
        }

        .option-btn.close {
            border-color: #3f1f1f;
            background: #1f0f0f;
        }

        .option-btn.close:hover {
            border-color: #4f1f1f;
            background: #2a1212;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #27272a;
            border-top-color: #fafafa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            animation: slideUp 0.5s ease-out 0.3s both;
        }

        .footer p {
            font-size: 12px;
            color: #3f3f46;
            letter-spacing: 0.05em;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px;
            }

            .option-btn {
                padding: 18px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="logo">
            <h1>Infrared</h1>
            <p>Enterprise Protocol Suite</p>
        </header>

        <nav class="options" id="options">
            <button class="option-btn" data-action="launch" data-key="Y">
                <span>Launch Infrared</span>
                <span class="key">Y</span>
            </button>
            <button class="option-btn close" data-action="close" data-key="N">
                <span>Close</span>
                <span class="key">N</span>
            </button>
        </nav>

        <footer class="footer">
            <p>Select an option to continue</p>
        </footer>
    </main>

    <script>
        const options = document.getElementById("options");
        const buttons = options.querySelectorAll(".option-btn");
        let isProcessing = false;

        document.addEventListener("keydown", (event) => {
            if (isProcessing) return;

            const key = event.key.toLowerCase();

            if (key === "y" || key === "enter") {
                event.preventDefault();
                handleAction("launch");
            } else if (key === "n" || key === "escape") {
                event.preventDefault();
                handleAction("close");
            }
        });

        buttons.forEach(btn => {
            btn.addEventListener("click", () => {
                if (isProcessing) return;
                const action = btn.dataset.action;
                handleAction(action);
            });
        });

        function handleAction(action) {
            if (isProcessing) return;
            isProcessing = true;

            const selectedBtn = document.querySelector(`[data-action="${action}"]`);

            if (action === "launch") {
                launchInfrared();
            } else if (action === "close") {
                closeLauncher();
            }
        }

        function launchInfrared() {
            const btn = document.querySelector('[data-action="launch"]');
            btn.innerHTML = '<span>Launching...</span><span class="spinner"></span>';
            
            setTimeout(() => {
                btn.innerHTML = '<span>Launch Infrared</span><span class="key">Y</span>';
                window.location.href = atob("aHR0cHM6Ly9wcmV2aWV3LnRlaXRpb24uY29t");
            }, 800);
        }

        function closeLauncher() {
            const btn = document.querySelector('[data-action="close"]');
            btn.innerHTML = '<span>Closing...</span><span class="spinner"></span>';

            setTimeout(() => {
                window.close();
                if (!window.closed) {
                    btn.innerHTML = '<span>Close</span><span class="key">N</span>';
                    isProcessing = false;
                }
            }, 500);
        }
    </script>
</body>

</html>
